on: [push]
jobs:
  build:
    runs-on: linux
    container:
      image: registry:5000/debian-rust-wasm-vercel
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          show-progress: true

      - name: Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Build
        run: >
          RUSTFLAGS="-Ctarget-cpu=mvp"
          cargo build
          -Zbuild-std=panic_abort,std
          --target wasm32-unknown-unknown
          --release
          --package peertube

      - name: Package
        run: mkdir dist;
          cp -v target/wasm32-unknown-unknown/release/peertube.wasm dist/app.wasm;
          cp -rv tools/cli/src/html/* dist/;

      - name: Publish
        if: github.ref != 'refs/heads/main'
        run: vercel -y --token ${{ secrets.VERCEL_TOKEN }}

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: vercel -y --prod --token ${{ secrets.VERCEL_TOKEN }}
