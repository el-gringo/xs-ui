[workspace]
resolver = "2"
members = [
    "crates/*",
    "crates/xs-macro/tests",
    "examples/app",
    "tools/cli"
]
default-members = [
    "examples/app"
]

[workspace.package]
version = "0.1.0"
authors = [
    "christophe.bosse@gmail.com"
]
edition = "2024"

[workspace.dependencies]
xs-backend = { path = "crates/xs-backend" }
xs-backend-core = { path = "crates/xs-backend-core" }
xs-backend-browser = { path = "crates/xs-backend-browser" }
xs-backend-wayland = { path = "crates/xs-backend-wayland" }
xs-backend-wayland-egl = { path = "crates/xs-backend-wayland-egl" }
xs-backend-wayland-extensions = { path = "crates/xs-backend-wayland-extensions" }
xs-backend-wayland-client = { path = "crates/xs-backend-wayland-client" }
xs-backend-wayland-xkb = { path = "crates/xs-backend-wayland-xkb" }
xs-core = { path = "crates/xs-core" }
xs-egl-sys = { path = "crates/xs-egl-sys" }
xs-gl-sys = { path = "crates/xs-gl-sys" }
xs-layout = { path = "crates/xs-layout" }
xs-http = { path = "crates/xs-http" }
xs-macro = { path = "crates/xs-macro" }
xs-macro-tests = { path = "crates/xs-macro/tests" }
xs-math = { path = "crates/xs-math" }
xs-platform-event = { path = "crates/xs-platform-event" }
xs-platform-linux = { path = "crates/xs-platform-linux" }
xs-primitive = { path = "crates/xs-primitive" }
xs-primitive2 = { path = "crates/xs-primitive2" }
xs-renderer-core = { path = "crates/xs-renderer-core" }
xs-renderer-opengl = { path = "crates/xs-renderer-opengl" }
xs-renderer-webgl = { path = "crates/xs-renderer-webgl" }
xs-tls = { path = "crates/xs-tls" }
xs-url = { path = "crates/xs-url" }
xs-websocket = { path = "crates/xs-websocket" }
test_utils = { path = "tools/test_utils" }
pretty_assertions = { version = "1.4" }

[profile.dev]
lto = "off"
panic = "abort"
strip = "debuginfo"
opt-level = 1       # mproves incremental builds

[profile.dev-smartv]
inherits = "dev"
lto = "thin"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
#strip = "symbols"
strip = "debuginfo"
panic = "abort"

[profile.release-smartv]
inherits = "release"
lto = "thin"
