steps:
  build:
    image: rust:1.86.0-alpine
    commands:
      - rustup target list | grep installed | grep wasm32-unknown-unknown
        || rustup target add wasm32-unknown-unknown
      - cargo build
        --package app
        --target wasm32-unknown-unknown
        --release
      - mkdir dist &&
      - cp -v target/wasm32-unknown-unknown/release/app.wasm dist/
      - cp -v tools/cli/src/assets/* dist/
    when:
      event: [tag, push]
    volumes:
      - /cache/.cargo:~/.cargo

  deploy:
    image: node:20-alpine
    commands:
      - which vercel || vercel deploy --yes --token $VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: VERCEL_TOKEN
    when:
      event: [tag, push]
    volumes:
      - /cache/node_modules:/usr/local/lib/node_modules
      - /cache/.npm:/root/.npm
      - /cache/bin:/usr/local/bin
