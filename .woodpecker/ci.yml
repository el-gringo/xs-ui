steps:
  restore-cache:
    image: plugins/s3-cache
    settings:
      restore: true
      cache_key: '{{ .Repo.Name }}_{{ arch }}_{{ os }}'
      endpoint: http://minio:9000/
      access_key: G59L4Z47HMxQBpcBl9ZQ
      secret_key: 0Mc0ijza022SBt66dk9A9qkK941lz9zMqrHfqz4x
      mount:
        - /root/.cargo
        - /root/.npm
        - /usr/local/bin/vercel
        - /usr/local/lib/node_modules
    when:
      event: [tag, push, manual]

  prepare-rust:
    image: rust:1.86.0-alpine
    commands:
      - ls -la ~/.cargo/ || true
      - rustup target list | grep installed | grep wasm32-unknown-unknown
          || rustup target add wasm32-unknown-unknown
    when:
      event: [tag, push, manual]

  prepare-node:
    image: node:20-alpine
    commands:
      - apk list
      - cat /etc/passwd
      - whoami
      - ls -la /root/
      - which vercel || npm install -g vercel || true
    when:
      event: [tag, push, manual]

  rebuild-cache:
    image: plugins/s3-cache
    settings:
      rebuild: true
      endpoint: http://minio:9000/
      access_key: G59L4Z47HMxQBpcBl9ZQ
      secret_key: 0Mc0ijza022SBt66dk9A9qkK941lz9zMqrHfqz4x
      mount:
        - /root/.cargo
        - /root/.npm
        - /usr/local/bin/vercel
        - /usr/local/lib/node_modules
    when:
      event: [tag, push, manual]

  check:
    image: rust:1.86.0-alpine
    commands:
      - cargo check || true
    when:
      event: [tag, push, manual]

  build:
    image: rust:1.86.0-alpine
    commands:
      - cargo build
          --package app
          --target wasm32-unknown-unknown
          --release
      - mkdir dist &&
      - cp -v target/wasm32-unknown-unknown/release/app.wasm dist/
      - cp -v tools/cli/src/assets/* dist/
    when:
      event: [tag, push, manual]

  deploy:
    image: node:20-alpine
    commands:
      - which vercel || npm install -g vercel
      - vercel deploy --yes --token $VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: VERCEL_TOKEN
    when:
      event: push

  deploy-prod:
    image: node:20-alpine
    commands:
      - which vercel || npm install -g vercel
      - vercel deploy --yes --prod --token $VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: VERCEL_TOKEN
    when:
      event: tag
