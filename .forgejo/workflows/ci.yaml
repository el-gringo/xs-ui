on: [push]
jobs:
  build:
    runs-on: docker
    container:
          image: node:lts-bullseye
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Get node global dir
        id: node-global-dir
        run: echo "dir=$(dirname $(dirname $(which npm)))" >> ${GITHUB_OUTPUT}

      - name: Restore cache rust toolchain
        id: cache-rust-toolchain
        uses: https://code.forgejo.org/actions/cache/restore@v4
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
            ./dist/
          key: ${{ runner.os }}-rust-toolchain

      - name: Install Rust
        id: rust-toolchain
        if: steps.cache-rust-toolchain.outputs.cache-hit != 'true'
        uses: https://code.forgejo.org/msrd0/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Save cache rust toolchain
        if: steps.cache-rust-toolchain.outputs.cache-hit != 'true'
        uses: https://code.forgejo.org/actions/cache/save@v4
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-rust-toolchain

      - name: Build
        run:
          cargo build --package app --target wasm32-unknown-unknown --release || exit 1

      - name: Create dist
        run:
          mkdir dist &&
          cp -v target/wasm32-unknown-unknown/release/app.wasm dist/ &&
          cp -v tools/cli/src/assets/* dist/

      - name: Restore cache npm
        id: cache-npm
        uses: https://code.forgejo.org/actions/cache/restore@v4
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            ${{ steps.npm-global-dir.outputs.dir }}
          key: ${{ runner.os }}-npm

      - name: Install vercel
        if: steps.cache-npm.outputs.cache-hit != 'true'
        run: npm -g install vercel

      - name: Save cache npm
        if: steps.cache-npm.outputs.cache-hit != 'true'
        uses: https://code.forgejo.org/actions/cache/save@v4
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            ${{ steps.npm-global-dir.outputs.dir }}
          key: ${{ runner.os }}-npm

      - if: github.ref != 'refs/heads/main'
        run: vercel -y --token ${{ secrets.VERCEL_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        run: vercel -y --prod --token ${{ secrets.VERCEL_TOKEN }}
