[package]
name = "xs-backend-wayland"
version.workspace = true
authors.workspace = true
edition.workspace = true

[features]
default = [
    "image"
]
# Image decoding is xs-image, which dlopens libjpeg / libpng16 / libwebp /
# libjxl at runtime. Nothing is linked at build time, so a device missing one of
# them still builds and still decodes the others; xs-image leaves that codec out
# of its registry and answers `supports(format)` accordingly.
#
# QOI was dropped here: zune-image carried it and xs-image has no codec for it.
image = [
    "xs-http",
    "xs-image"
]

[dependencies]
xs-core.workspace = true
xs-backend-wayland-egl.workspace = true
xs-backend-wayland-extensions.workspace = true
xs-backend-wayland-client.workspace = true
xs-backend-wayland-xkb.workspace = true
xs-egl-sys.workspace = true
xs-gl-sys.workspace = true
xs-layout.workspace = true
xs-platform-event.workspace = true
xs-platform-linux.workspace = true
xs-renderer-core.workspace = true

# optional
xs-http.optional = true
xs-http.path = "../xs-http"

xs-image.optional = true
xs-image.path = "../xs-image"
