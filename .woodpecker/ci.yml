steps:
  check:
    image: alpine-rust-wasm32-vercel
    commands:
      - cargo check || true
    when:
      event: [tag, push, manual]

  build:
    image: alpine-rust-wasm32-vercel
    commands:
      - cargo build
          --package app
          --target wasm32-unknown-unknown
          --release
      - mkdir dist &&
      - cp -v target/wasm32-unknown-unknown/release/app.wasm dist/
      - cp -v tools/cli/src/assets/* dist/
    when:
      event: [tag, push, manual]

  deploy:
    image: alpine-rust-wasm32-vercel
    commands:
      - vercel deploy --yes --token $VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: VERCEL_TOKEN
    when:
      event: push

  deploy-prod:
    image: node:22-alpine
    commands:
      - vercel deploy --yes --prod --token $VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: VERCEL_TOKEN
    when:
      event: tag
