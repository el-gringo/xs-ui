on: [push]
jobs:
  build:
    runs-on: docker
    container:
          image: node:lts-bullseye
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Get npm cache directory
        id: npm-cache-dir
        run: echo "dir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

      - name: Cache
        id: cache
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ${{ steps.npm-cache-dir.outputs.dir }}
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ./target/
            ./dist/
          key: ${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-

      - name: Install Rust
        id: rust-toolchain
        if: steps.cache.outputs.cache-hit != 'true'
        uses: https://code.forgejo.org/msrd0/rust-toolchain@stable
        with:
          toolchain: nightly
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Build
        run:
          cargo build --package app --target wasm32-unknown-unknown --release || exit 1

      - name: Create dist
        run:
          cp -v target/wasm32-unknown-unknown/release/app.wasm dist/ &&
          cp -v tools/cli/src/assets/* dist/

      - name: Install vercel
        run: npm -g install vercel

      - if: github.ref != 'refs/heads/main'
        run: vercel -y --token ${{ secrets.VERCEL_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        run: vercel -y --prod --token ${{ secrets.VERCEL_TOKEN }}
