on: [push]
jobs:
  build:
    runs-on: docker
    container:
      image: rust:alpine
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - run: ./build.sh release

  deploy:
    runs-on: docker
    needs:
      - build
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: dist
      - run: ls -la
      - run: npm -g install vercel
      - if: github.ref != 'refs/heads/main'
        run: vercel -y --token ${{ secrets.VERCEL_TOKEN }}
      - if: github.ref == 'refs/heads/main'
        run: vercel -y --prod --token ${{ secrets.VERCEL_TOKEN }}
