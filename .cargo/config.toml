# The tool passes --target itself, so a default target is not needed here and
# only gets in the way of host builds (`cargo build -p xs-cli`).

# Compatible WebAssembly builds for older Smart TV webviews (Tizen/webOS):
# pin wasm32-unknown-unknown to the "mvp" (pre-SIMD, pre-sign-ext) baseline
# and rebuild `std` from source so no newer instruction set leaks in.
[unstable]
#build-std = ["std", "panic_abort"]

[target.wasm32-unknown-unknown]
# Note: rustc >= the active nightly renamed `target-features` (plural) to
# `target-feature`; newer LLVM also no longer strips `sign-ext` from the
# `mvp` CPU, so it must be disabled explicitly or Chrome 63's V8 rejects the
# module with "Invalid opcode" at every `i32.extend8_s`/`i64.extend16_s`.
rustflags = ["-C", "target-cpu=mvp", "-C", "target-feature=-sign-ext"]
