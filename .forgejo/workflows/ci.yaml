on: [push]
jobs:
  build:
    runs-on: docker
    container:
      image: registry:5000/alpine-rust-wasm32-vercel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # - name: Check
      #   run:
      #     cargo check

      - name: Build
        run:
          cargo build --package app --target wasm32-unknown-unknown --release

      - name: Create dist
        run:
          mkdir dist;
          cp -v target/wasm32-unknown-unknown/release/app.wasm dist/;
          cp -rv tools/cli/src/html/* dist/;

      - if: github.ref != 'refs/heads/main'
        run: vercel -y --token ${{ secrets.VERCEL_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        run: vercel -y --prod --token ${{ secrets.VERCEL_TOKEN }}
