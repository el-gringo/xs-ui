[package]
name = "xs-text-system-glyph"
version.workspace = true
authors.workspace = true
edition.workspace = true


[dependencies]
xs-text-system-ttf-parser.workspace = true
xs-text-system-rasterizer.workspace = true
# no_std float stuff
libm = { version = "0.2.1", optional = true }

[dev-dependencies]
# don't add any, instead use ./dev

[features]
default = ["std"]

# Activates usage of std.
std = ["xs-text-system-ttf-parser/std", "xs-text-system-rasterizer/std"]
# Uses libm when not using std. This needs to be active in that case.
libm = ["dep:libm", "xs-text-system-rasterizer/libm", "xs-text-system-ttf-parser/no-std-float"]
# Enables `VariableFont` functionality.
variable-fonts = ["xs-text-system-ttf-parser/variable-fonts"]
# Enables full gvar table support.
gvar-alloc = ["xs-text-system-ttf-parser/gvar-alloc"]
