on: [push]
jobs:
  build:
    runs-on: linux
    container:
      image: registry:5000/debian-rust-wasm-vercel
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Build
        run: cargo build --package peertube --target wasm32-unknown-unknown --release

      - name: Create dist
        run: mkdir dist;
          cp -v target/wasm32-unknown-unknown/release/peertube.wasm dist/;
          cp -rv tools/cli/src/html/* dist/;
          sed -i "s/{wasm-file}/peertube/" dist/index.html;

      - if: github.ref != 'refs/heads/main'
        run: vercel -y --token ${{ secrets.VERCEL_TOKEN }}

      - if: github.ref == 'refs/heads/main'
        run: vercel -y --prod --token ${{ secrets.VERCEL_TOKEN }}
