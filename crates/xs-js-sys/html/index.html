<html>
    <head>
        <meta charset="utf-8" />
        <title>XS-UI</title>
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="assets/img/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="assets/img/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="assets/img/favicon-16x16.png"
        />
        <link rel="manifest" href="assets/img/site.webmanifest" />
        <style>
            body {
                margin: 0;
            }
            /*
             * The page ships without a canvas: the app or the example creates
             * it (see crates/xs-backend-browser). It is positioned out of the
             * flow so it never pushes page content below the fold.
             */
            canvas {
                position: absolute;
                left: 0;
                top: 0;
                display: block;
                width: 100%;
                height: 100%;
                background: black;
            }
        </style>
    </head>
    <body>
        <script src="assets/js/boot.js"></script>
        <script>
            loadWasm(`{wasm-pathname}.wasm?${Date.now()}`);
        </script>
        <script>
            const MODE = "development";
            if (MODE === "development") {
                const secure = location.protocol === "https:";
                const host = location.origin.replace(/^http/, "ws");
                const ws = new WebSocket(`${host}/ws`);
                ws.onmessage = function (event) {
                    const { data } = event;
                    if (data.endsWith(".wasm")) {
                        load(data);
                    }
                };
                window.ws = ws;
            }
        </script>
    </body>
</html>
