on: [push]
jobs:
  build:
    runs-on: freebox
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          show-progress: true

      - name: Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Build and package
        run: cargo run -p xs-cli -- build peertube --release --dist dist

      - name: Publish
        if: github.ref != 'refs/heads/main'
        run: vercel -y --token ${{ secrets.VERCEL_TOKEN }}

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        run: vercel -y --prod --token ${{ secrets.VERCEL_TOKEN }}
