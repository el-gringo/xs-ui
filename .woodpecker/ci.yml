steps:
  setup:
    image: rust:alpine
    commands:
      - rustup target add wasm32-unknown-unknown
    when:
      event: [tag, push]

  build:
    image: rust
    commands:
      - ./build.sh release
    when:
      event: [tag, push]

  deploy:
    image: node:20-alpine
    commands:
      - npm install -g vercel
      - vercel deploy --yes --token $VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: VERCEL_TOKEN
    when:
      event: [tag, push]
