[workspace]
resolver = "2"
members = [
    "crates/*",
    #"crates/xs-macro/tests",
    "examples/*",
    "tools/*"
]
default-members = [
    "examples/counter",
    "examples/peertube",
    "examples/playground"
]

[workspace.package]
version = "0.1.0"
authors = [
    "christophe.bosse@gmail.com"
]
edition = "2024"

[workspace.dependencies]
xs = { path = "crates/xs" }
xs-animation = { path = "crates/xs-animation" }
xs-backend = { path = "crates/xs-backend" }
xs-backend-wayland-egl = { path = "crates/xs-backend-wayland-egl" }
xs-backend-wayland-extensions = { path = "crates/xs-backend-wayland-extensions" }
xs-backend-wayland-client = { path = "crates/xs-backend-wayland-client" }
xs-backend-wayland-xkb = { path = "crates/xs-backend-wayland-xkb" }
xs-core = { path = "crates/xs-core" }
xs-egl-sys = { path = "crates/xs-egl-sys" }
xs-font = { path = "crates/xs-font" }
xs-log = { path = "crates/xs-log" }
xs-gl = { path = "crates/xs-gl" }
xs-gl-sys = { path = "crates/xs-gl-sys" }
xs-js-sys = { path = "crates/xs-js-sys" }
xs-layout = { path = "crates/xs-layout" }
xs-http = { path = "crates/xs-http" }
xs-image = { path = "crates/xs-image" }
xs-image-core = { path = "crates/xs-image-core" }
xs-image-jpeg = { path = "crates/xs-image-jpeg" }
xs-image-jpeg-xl = { path = "crates/xs-image-jpeg-xl" }
xs-image-png = { path = "crates/xs-image-png" }
xs-image-webp = { path = "crates/xs-image-webp" }
xs-math = { path = "crates/xs-math" }
xs-platform-event = { path = "crates/xs-platform-event" }
xs-platform-linux = { path = "crates/xs-platform-linux" }
xs-primitive = { path = "crates/xs-primitive" }
xs-renderer = { path = "crates/xs-renderer" }
xs-renderer-core = { path = "crates/xs-renderer-core" }
xs-renderer-opengl = { path = "crates/xs-renderer-opengl" }
xs-text-system = { path = "crates/xs-text-system" }
xs-tls = { path = "crates/xs-tls" }
xs-url = { path = "crates/xs-url" }
xs-websocket = { path = "crates/xs-websocket" }

# External dependencies
log.version = "0.4"

nanoserde.path = "vendors/nanoserde"
nanoserde.default-features = false
nanoserde.features = [ "json" ]

test_utils = { path = "tools/test_utils" }
pretty_assertions = { version = "1.4" }

[profile.dev]
lto = "off"
panic = "abort"
#strip = "debuginfo"
opt-level = 1       # mproves incremental builds

[profile.dev-smartv]
inherits = "dev"
lto = "thin"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
#strip = "symbols"
strip = "debuginfo"
panic = "abort"

[profile.release-smartv]
inherits = "release"
lto = "thin"
# Thin LTO still keeps this smaller than a plain fat-LTO release.
opt-level = 3
