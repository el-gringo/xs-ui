<html lang="en">
<head>
    <meta charset="utf-8">
    <title>APP</title>
    <style>
        html,
        body,
        canvas {
            margin: 0px;
            padding: 0px;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: absolute;
            background: black;
            z-index: 0;
        }
    </style>
</head>
<body>
    <canvas id="glcanvas" tabindex="1"></canvas>

    <script src="https://oqee-web-dev.freeboxos.fr/chii/target.js"></script>
    <!--
    <script src="https://not-fl3.github.io/miniquad-samples/mq_js_bundle.js"></script>
    -->
    <script src="assets/script.js"></script>
    <script>load("/wasm32-unknown-unknown/debug/app.wasm");</script>
    <script>
        const secure = location.protocol === 'https:';
        const host = location.origin.replace(/^http/, 'ws');
        const ws = new WebSocket(`${host}/ws`);
        ws.onmessage = function(event) {
            console.log('onmessage', event);
            const { data } = event;
            if (data.endsWith('.wasm')) {
                load(data);
            }
        }
        ws.onopen = function() {
            console.log('onopen');
            ws.send('hello from client');
            ws.send('hello from client 2');
        }
        window.ws = ws;
    </script>
</body>
</html>
