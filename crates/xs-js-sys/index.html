<script>
    let wasm;
    let WASM_VECTOR_LEN = 0;

    const cachedTextDecoder = new TextDecoder("utf-8", {
        ignoreBOM: true,
        fatal: true,
    });
    cachedTextDecoder.decode();
    /**
     * @type {TextEncoder}
     */
    const cachedTextEncoder = new TextEncoder();

    let cachedUint8Memory0 = null;
    function getUint8Memory0() {
        if (
            cachedUint8Memory0 === null ||
            cachedUint8Memory0.byteLength === 0
        ) {
            cachedUint8Memory0 = new Uint8Array(wasm.memory.buffer);
        }
        return cachedUint8Memory0;
    }

    function getStringFromWasm0(ptr, len) {
        return cachedTextDecoder.decode(
            getUint8Memory0().subarray(ptr, ptr + len),
        );
    }

    let cachedUint8ArrayMemory0 = null;
    function getUint8ArrayMemory0() {
        if (
            cachedUint8ArrayMemory0 === null ||
            cachedUint8ArrayMemory0.byteLength === 0
        ) {
            cachedUint8ArrayMemory0 = new Uint8Array(wasm.memory.buffer);
        }
        return cachedUint8ArrayMemory0;
    }

    function passStringToWasm0(arg, malloc, realloc) {
        if (realloc === undefined) {
            const buf = cachedTextEncoder.encode(arg);
            const ptr = malloc(buf.length, 1) >>> 0;
            getUint8ArrayMemory0()
                .subarray(ptr, ptr + buf.length)
                .set(buf);
            WASM_VECTOR_LEN = buf.length;
            return ptr;
        }

        let len = arg.length;
        let ptr = malloc(len, 1) >>> 0;

        const mem = getUint8ArrayMemory0();

        let offset = 0;

        for (; offset < len; offset++) {
            const code = arg.charCodeAt(offset);
            if (code > 0x7f) break;
            mem[ptr + offset] = code;
        }
        if (offset !== len) {
            if (offset !== 0) {
                arg = arg.slice(offset);
            }
            ptr = realloc(ptr, len, (len = offset + arg.length * 3), 1) >>> 0;
            const view = getUint8ArrayMemory0().subarray(
                ptr + offset,
                ptr + len,
            );
            const ret = cachedTextEncoder.encodeInto(arg, view);

            offset += ret.written;
            ptr = realloc(ptr, len, offset, 1) >>> 0;
        }

        WASM_VECTOR_LEN = offset;
        return ptr;
    }

    function passBytesToWasm(buffer, malloc, realloc) {
        let bytes = new Uint8Array(buffer);
        const ptr = malloc(bytes.byteLength, 1) >>> 0;
        getUint8ArrayMemory0()
            .subarray(ptr, ptr + bytes.byteLength)
            .set(bytes);
        WASM_VECTOR_LEN = bytes.byteLength;
        return ptr;
    }

    let max_render_time = 0;
    const env = {
        console_log(ptr, len) {
            console.log(getStringFromWasm0(ptr, len));
        },
        fetch(handle, ptr, len) {
            const url = getStringFromWasm0(ptr, len);
            fetch(url)
                .then((response) => response.arrayBuffer())
                .then((body) => {
                    const ptr = passBytesToWasm(
                        body,
                        wasm.__xs_malloc,
                        wasm.__xs_realloc,
                    );
                    const len = WASM_VECTOR_LEN;
                    wasm.fetch_callback(handle, ptr, len);
                });
        },
        request_animation_frame(closure, vcall) {
            let start = performance.now();
            return requestAnimationFrame((now) => {
                wasm.callback_request_animation_frame(closure, vcall, now);
                const frame_duration = performance.now() - now;
                if (frame_duration > max_render_time) {
                    max_render_time = frame_duration;
                }
                if (performance.now() - start > 1000) {
                    console.log("max_render_time", max_render_time);
                    max_render_time = 0;
                    start = performance.now();
                }
            });
        },
    };
    fetch("{wasm-file}.wasm")
        .then((response) => response.arrayBuffer())
        .then((bytes) => WebAssembly.instantiate(bytes, { env }))
        .then((res) => {
            wasm = res.instance.exports;
            console.log("wasm", wasm);
            cachedUint8Memory0 = null;
            wasm.main();
        });
</script>
