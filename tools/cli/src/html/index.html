<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>XS-UI</title>
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="assets/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="assets/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="assets/favicon-16x16.png"
        />
        <link rel="manifest" href="assets/site.webmanifest" />
        <style>
            html,
            body,
            canvas {
                margin: 0px;
                padding: 0px;
                width: 100%;
                height: 100%;
                overflow: hidden;
                position: absolute;
                background: black;
                z-index: 0;
            }
        </style>
    </head>
    <body>
        <canvas id="glcanvas" tabindex="1"></canvas>
        <script src="assets/script.js"></script>
        <script>
            load(`app.wasm?${Date.now()}`);
        </script>
        <script>
            const MODE = "development";
            if (MODE === "development") {
                const secure = location.protocol === "https:";
                const host = location.origin.replace(/^http/, "ws");
                const ws = new WebSocket(`${host}/ws`);
                ws.onmessage = function (event) {
                    const { data } = event;
                    if (data.endsWith(".wasm")) {
                        load(data);
                    }
                };
                window.ws = ws;
            }
        </script>
    </body>
</html>
