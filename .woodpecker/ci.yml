steps:
  restore-cache:
    image: meltwater/drone-cache
    volumes:
      - woodpecker-cache:/woodpecker/src/cache
    settings:
      mount:
        - /root/.cargo
        - /root/.npm
        - /usr/local/bin
        - /usr/local/lib/node_modules

  build:
    image: rust:1.86.0-alpine
    commands:
      - rustup target list | grep installed | grep wasm32-unknown-unknown
        || rustup target add wasm32-unknown-unknown
      - cargo build
        --package app
        --target wasm32-unknown-unknown
        --release
      - mkdir dist &&
      - cp -v target/wasm32-unknown-unknown/release/app.wasm dist/
      - cp -v tools/cli/src/assets/* dist/
    when:
      event: [tag, push]

  upload-rust-toolchain:
      image: woodpeckerci/plugin-s3
      settings:
        bucket: woodpecker-cache
        source: ~/.cargo
        target: /.cargo
        endpoint: http://minio:9000

  deploy:
    image: node:20-alpine
    commands:
      - which vercel || vercel deploy --yes --token $VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: VERCEL_TOKEN
    when:
      event: [tag, push]
    volumes:
      - /cache/node_modules:/cache/node_modules
      - /cache/.npm:/cache/.npm
      - /cache/bin:/cache/bin

  upload-node_modules:
    image: woodpeckerci/plugin-s3
    settings:
      bucket: woodpecker-cache
      source: /usr/local/lib/node_modules
      target: /node_modules
      endpoint: http://minio:9000

  upload-node_binaries:
    image: woodpeckerci/plugin-s3
    settings:
      bucket: woodpecker-cache
      source: /usr/local/bin
      target: /bin
      endpoint: http://minio:9000
