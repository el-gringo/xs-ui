<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>XS-UI</title>
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="assets/img/apple-touch-icon.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="assets/img/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="assets/img/favicon-16x16.png"
        />
        <link rel="manifest" href="assets/img/site.webmanifest" />
        <style>
            body {
                margin: 0;
            }
            /*
             * The page ships without a canvas: the app or the example creates
             * it (see crates/xs-backend-browser). It is positioned out of the
             * flow so it never pushes page content below the fold.
             */
            canvas {
                position: absolute;
                left: 0;
                top: 0;
                display: block;
                width: 100%;
                height: 100%;
                background: black;
            }
        </style>
    </head>
    <body>
        <!--
            The loader goes here: `xs serve` and `xs build` replace this link
            with the script that boots the wasm (plus, in dev, the hot reload
            client), so this file stays plain html. Without a link the script is
            appended at the end of the body.
        -->
        <link rel="rust" />
    </body>
</html>
