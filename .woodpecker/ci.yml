steps:
  restore-cache:
    image: meltwater/drone-cache
    settings:
      restore: true
      cache_key: '{{ .Repo.Name }}_{{ arch }}_{{ os }}'
      bucket: woodpecker-cache
      mount:
        - /root/.cargo
        - /root/.npm
        - /usr/local/bin/vercel
        - /usr/local/lib/node_modules
    when:
      event: [tag, push]

  prepare-rust:
    image: rust:1.86.0-alpine
    commands:
      - ls -la ~/.cargo/ || true
      - rustup target list | grep installed | grep wasm32-unknown-unknown
          || rustup target add wasm32-unknown-unknown
    when:
      event: [tag, push]

  prepare-node:
    image: node:20-alpine
    commands:
      - which vercel || npm install -g vercel
    when:
      event: [tag, push]

  rebuild-cache:
      image: meltwater/drone-cache
      settings:
        bucket: woodpecker-cache
        mount:
          - /root/.cargo
          - /root/.npm
          - /usr/local/bin/vercel
          - /usr/local/lib/node_modules

  check:
    image: rust:1.86.0-alpine
    commands:
      - cargo check || true
    when:
      event: [tag, push]

  build:
    image: rust:1.86.0-alpine
    commands:
      - cargo build
          --package app
          --target wasm32-unknown-unknown
          --release
      - mkdir dist &&
      - cp -v target/wasm32-unknown-unknown/release/app.wasm dist/
      - cp -v tools/cli/src/assets/* dist/
    when:
      event: [tag, push]

  deploy:
    image: node:20-alpine
    commands:
      - which vercel || npm install -g vercel
      - vercel deploy --yes --token $VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: VERCEL_TOKEN
    when:
      event: push

  deploy-prod:
    image: node:20-alpine
    commands:
      - which vercel || npm install -g vercel
      - vercel deploy --yes --prod --token $VERCEL_TOKEN
    environment:
      VERCEL_TOKEN:
        from_secret: VERCEL_TOKEN
    when:
      event: tag
